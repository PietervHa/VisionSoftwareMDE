# Vision Software Configuration
# Default configuration for the machine vision application

# Top-level settings
vision_mode: "ocr"  # valid values: "ocr" (default, backward compatible), "object_detection"
machine_id: "default"
confidence_threshold: 0.8

# Region of Interest (ROI) settings
roi:
  x_start: 0.0
  y_start: 0.6667
  x_end: 1.0
  y_end: 1.0

# OCR settings
ocr:
  engine: "tesseract"   # valid values: "tesseract" (default), "paddleocr"
  keywords:
    - "www.theimagingsource.com"
  # Regex matches dates in DD/MM/YYYY or MM/DD/YYYY format
  date_regex: '\b\d{2}/\d{2}/\d{4}\b'
  preprocess: "fast"
  downscale: 0.6
  min_dim: 240
  psm: 7
  oem: 3
  whitelist: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789."
  disable_dawgs: true
  tesseract_path: "C:/Program Files/Tesseract-OCR/tesseract.exe"

# Camera settings
camera:
  index: 0
  width: 1280
  height: 1024
  flip: -1

# Object detection settings
object_detection:
  # Active backend: "classifier" (local HF classifier), "cola" (Roboflow API), "yolo" (local YOLO model_path)
  detector_backend: "cola"
  model_path: "models/yolov8n.pt"
  inference_size: 640
  # Backward-compatibility fallback when detector_backend is not set.
  # If true -> "cola", if false -> "classifier".
  use_cola_detector: true
  # Roboflow Cola Detection API configuration
  cola_api_key: "SwXK94LMoGhQfZsk8xCG"
  cola_workspace: "pieters-workspace-kugm8"
  cola_workflow: "detect-count-and-visualize"
  # Path to trained classifier model folder (kept for backward compatibility)
  # Only used if use_cola_detector is false
  classifier_model_path: "./models/classifier/final"

# HMI settings
hmi:
  debug_draw_roi: true
  enable_video_feed: true

# Web settings
web:
  host: "0.0.0.0"
  port: 5000

# Output settings
output:
  result_dir: "data/results"

