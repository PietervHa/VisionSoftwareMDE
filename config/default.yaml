# Vision Software Configuration
# Default configuration for the machine vision application

# Top-level settings
vision_mode: "object_detection"  # valid values: "ocr" (default, backward compatible), "object_detection"
machine_id: "default"
confidence_threshold: 0.8

# Region of Interest (ROI) settings
roi:
  x_start: 0.0
  y_start: 0.6667
  x_end: 1.0
  y_end: 1.0

# OCR settings
ocr:
  engine: "tesseract"   # valid values: "tesseract" (default), "paddleocr"
  keywords:
    - "www.theimagingsource.com"
  # Regex matches dates in DD/MM/YYYY or MM/DD/YYYY format
  date_regex: '\b\d{2}/\d{2}/\d{4}\b'
  preprocess: "fast"
  downscale: 0.6
  min_dim: 240
  psm: 7
  oem: 3
  whitelist: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789."
  disable_dawgs: true
  tesseract_path: "C:/Program Files/Tesseract-OCR/tesseract.exe"

# Camera settings
camera:
  index: 0
  width: 1280
  height: 1024
  flip: -1

# Object detection settings
object_detection:
  # Active backend: "classifier" (local HF classifier), "roboflow" (remote API), "yolo" (local YOLO model_path)
  # Switch this to select which detection pipeline is used at runtime.
  backend: "template"

  # Local YOLO weights path (used when backend is set to "yolo").
  model_path: "models/yolov8n.pt"
  inference_size: 640

  # Classifier backend settings (used when backend is "classifier").
  classifier:
    model_path: "./models/classifier/final"

  # Template matching backend settings.
  template:
    # One or more reference images used for matching.
    references:
      - "data/templates/template_1776865591718.jpg"
      - "data/templates/template_1776865591718_scale0_85.jpg"
      - "data/templates/template_1776865591718_scale1_15.jpg"
      - "data/templates/template_1776865611958.jpg"
      - "data/templates/template_1776865611958_scale0_85.jpg"
      - "data/templates/template_1776865611958_scale1_15.jpg"
      - "data/templates/template_1776865627067.jpg"
      - "data/templates/template_1776865627067_scale0_85.jpg"
      - "data/templates/template_1776865627067_scale1_15.jpg"
    match_threshold: 0.6
    display_label: "boterbloempje"
    # Resize incoming ROI to reference dimensions before comparison.
    resize_to_reference: true

  # Roboflow backend settings (used when backend is "roboflow").
  roboflow:
    # Select which Roboflow profile to use from roboflow.models.
    model: "cola_detectie"
    models:
      cola_detectie:
        api_key: "SwXK94LMoGhQfZsk8xCG"
        workspace: "pieters-workspace-kugm8"
        workflow: "detect-count-and-visualize"
        api_url: "https://serverless.roboflow.com"

# HMI settings
hmi:
  debug_draw_roi: true
  enable_video_feed: true

# Web settings
web:
  host: "0.0.0.0"
  port: 5000

# Output settings
output:
  result_dir: "data/results"

